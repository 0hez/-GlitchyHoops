<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Street Fighter 95</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif;color:#fff}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;display:flex;gap:12px;padding:10px}
.bar{flex:1;height:16px;background:#400;border:2px solid #fff;transform-origin:left}
.bar i{display:block;height:100%;background:#2e2;width:100%}
#p2bar i{margin-left:auto;background:#e82}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:28px;font-weight:800;text-shadow:0 2px 8px #000;padding:20px;white-space:pre-line}
#ctl{position:fixed;bottom:env(safe-area-inset-bottom,0);left:0;right:0;display:flex;justify-content:space-between;padding:14px}
.g{display:flex;gap:10px}
.b{width:68px;height:68px;border-radius:50%;background:#fff3;border:2px solid #fff8;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;backdrop-filter:blur(4px)}
.b.on{background:#fff8}
</style></head><body>
<div id="hud"><div class="bar" id="p1bar"><i></i></div><div class="bar" id="p2bar"><i></i></div></div>
<div id="msg">Loading…</div>
<div id="ctl">
 <div class="g"><div class="b" data-k="L">◀</div><div class="b" data-k="R">▶</div></div>
 <div class="g"><div class="b" data-k="B">BLOCK</div><div class="b" data-k="K">KICK</div><div class="b" data-k="P">PUNCH</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script>
/* Put these next to index.html (your original files, unchanged):
   interstate_95_highway.glb, Ch11_part1-3.bin, Ch24_part1-3.bin
   Serve the folder (e.g. `python3 -m http.server`) and open on your phone. */
const $=id=>document.getElementById(id), msg=$('msg');
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc4e8);scene.fog=new THREE.Fog(0x9fc4e8,30,160);
const cam=new THREE.PerspectiveCamera(45,1,0.1,500);
scene.add(new THREE.HemisphereLight(0xffffff,0x556677,1.0));
const sun=new THREE.DirectionalLight(0xffffff,1.1);sun.position.set(6,12,8);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10});scene.add(sun);
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

async function loadFBX(prefix){
  const bufs=[];
  for(let i=1;i<=3;i++){msg.textContent=`Loading ${prefix} ${i}/3…`;bufs.push(await (await fetch(`${prefix}_part${i}.bin`)).arrayBuffer());}
  const all=new Uint8Array(bufs.reduce((a,b)=>a+b.byteLength,0));let o=0;
  bufs.forEach(b=>{all.set(new Uint8Array(b),o);o+=b.byteLength});
  return new THREE.FBXLoader().parse(all.buffer,'');
}
const N=n=>n.replace(/[^a-zA-Z]/g,'').replace(/^mixamorig/,'');
const A=new THREE.Vector3(),B=new THREE.Vector3(),Pq=new THREE.Quaternion();

class Fighter{
  constructor(model,x,dir){
    this.root=new THREE.Group();this.root.rotation.order='YXZ';this.root.add(model);scene.add(this.root);
    const h=new THREE.Box3().setFromObject(model).getSize(V()).y;model.scale.multiplyScalar(1.8/h);
    model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false}});
    this.b={};this.rest={};model.traverse(o=>{if(o.isBone){const n=N(o.name);this.b[n]=o;this.rest[n]=o.quaternion.clone()}});
    this.x=x;this.dir=dir;this.hp=100;this.act='idle';this.t=0;this.dur=1;this.done=false;this.hand=0;this.move=0;this.ko=0;this.tm=Math.random()*9;
    this.input={L:0,R:0,P:0,K:0,B:0};
  }
  start(a){if(this.act!=='idle'||this.hp<=0)return;this.act=a;this.t=0;this.done=false;this.dur=a==='punch'?0.34:0.5;if(a==='punch')this.hand^=1}
  hurt(d,from){
    if(this.act==='block'&&this.dir*from<0){d*=0.15}else{this.act='hit';this.t=0;this.dur=0.35}
    this.hp=Math.max(0,this.hp-d);this.x+=from*0.25;
    if(this.hp<=0){this.act='ko';this.t=0}
  }
  update(dt,foe){
    this.tm+=dt;this.t+=dt;const i=this.input;
    if(this.act==='idle'||this.act==='block'){
      if(i.B&&this.act==='idle')this.act='block';
      if(this.act==='block'&&!i.B)this.act='idle';
      if(this.act==='idle'){if(i.P)this.start('punch');else if(i.K)this.start('kick')}
      this.move=0;
      if(this.act==='idle'){this.move=i.R-i.L;this.x+=this.move*2.2*dt}
    }else if(this.act==='punch'||this.act==='kick'){
      const k=this.t/this.dur;
      if(!this.done&&k>0.45){this.done=true;
        const d=foe.x-this.x,reach=this.act==='punch'?1.25:1.5;
        if(Math.sign(d)===this.dir&&Math.abs(d)<reach&&foe.act!=='ko')foe.hurt(this.act==='punch'?7:11,this.dir)}
      if(k>=1)this.act='idle';
    }else if(this.act==='hit'&&this.t>=this.dur)this.act='idle';
    if(this.act==='ko')this.ko=Math.min(1,this.ko+dt*2.5);
    this.x=Math.max(-6,Math.min(6,this.x));
    if(Math.abs(this.x-foe.x)<0.8)this.x=foe.x-this.dir*0.8;
    this.x=Math.max(-6.5,Math.min(6.5,this.x));
  }
  setDir(bone,child,v){
    bone.updateWorldMatrix(true,false);child.updateWorldMatrix(true,false);
    bone.getWorldPosition(A);child.getWorldPosition(B);B.sub(A).normalize();
    const tg=v.clone().normalize().applyQuaternion(this.root.quaternion);
    const D=new THREE.Quaternion().setFromUnitVectors(B,tg);
    bone.parent.getWorldQuaternion(Pq);
    bone.quaternion.premultiply(Pq).premultiply(D).premultiply(Pq.invert());
  }
  pose(gy){
    const b=this.b,r=this.root;
    for(const n in this.rest)b[n].quaternion.copy(this.rest[n]);
    const k=Math.min(1,this.t/this.dur),pk=Math.sin(Math.PI*k),bob=Math.sin(this.tm*4)*0.04;
    r.position.set(this.x,gy,0);r.rotation.set(0,this.dir>0?Math.PI/2:-Math.PI/2,0);
    if(this.act==='hit')r.rotation.x=-0.25*Math.sin(Math.PI*k);
    if(this.act==='kick')r.rotation.x=-0.12*pk;
    if(this.act==='ko'){r.rotation.x=-1.5*this.ko;r.position.y=gy+0.12*this.ko}
    r.updateMatrixWorld(true);
    for(const [side,s] of [['Left',1],['Right',-1]]){
      const isP=(this.act==='punch')&&((side==='Left')===(this.hand===0));
      let U=V(s*.3,-.75,.4+bob),F=V(s*.05,.6+bob,.8);
      if(this.act==='block'){U=V(s*.15,-.3,.9);F=V(-s*.1,1,.25)}
      if(this.act==='hit'||this.act==='ko'){U=V(s*.5,-.7,-.3);F=V(s*.3,-.8,-.2)}
      if(isP){U.lerp(V(s*.05,-.05,1),pk);F.lerp(V(0,0,1),pk)}
      this.setDir(b[side+'Arm'],b[side+'ForeArm'],U);
      this.setDir(b[side+'ForeArm'],b[side+'Hand'],F);
      let lU=V(s*.1,-1,s*.25-.1),lF=V(s*.08,-1,-s*.1);
      if(this.move)lU.z+=Math.sin(this.tm*10+(s>0?0:Math.PI))*0.5*this.dir*this.move*this.dir;
      if(this.act==='kick'&&side==='Right'){lU.lerp(V(0,.1,1),pk);lF.lerp(V(0,.05,1),pk)}
      this.setDir(b[side+'UpLeg'],b[side+'Leg'],lU);
      this.setDir(b[side+'Leg'],b[side+'Foot'],lF);
    }
  }
}

let P1,P2,gy=0,over=false,held={};
function ai(f,foe,dt){
  const i=f.input;i.L=i.R=i.P=i.K=i.B=0;if(over)return;
  const d=Math.abs(f.x-foe.x);
  if(d>1.4)i[f.dir>0?'R':'L']=1;
  else if(d<1.0&&Math.random()<dt*1.2)i[f.dir>0?'L':'R']=1;
  if(d<1.5){
    if((foe.act==='punch'||foe.act==='kick')&&Math.random()<0.6)f.blockT=0.35;
    if(f.act==='idle'&&Math.random()<dt*1.6)i[Math.random()<.6?'P':'K']=1;
  }
  if(f.blockT>0){f.blockT-=dt;i.B=1}
}
function reset(){P1.hp=P2.hp=100;P1.x=-1.5;P2.x=1.5;P1.act=P2.act='idle';P1.ko=P2.ko=0;over=false;msg.textContent='FIGHT!';setTimeout(()=>{if(!over)msg.textContent=''},900)}
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);const dt=Math.min(0.05,(now-last)/1000);last=now;
  const i=P1.input;i.L=held.L|0;i.R=held.R|0;i.P=held.P|0;i.K=held.K|0;i.B=held.B|0;
  ai(P2,P1,dt);P1.update(dt,P2);P2.update(dt,P1);
  P1.pose(gy);P2.pose(gy);
  $('p1bar').firstChild.style.width=P1.hp+'%';$('p2bar').firstChild.style.width=P2.hp+'%';
  if(!over&&(P1.hp<=0||P2.hp<=0)){over=true;msg.textContent=(P1.hp<=0?'YOU LOSE':'YOU WIN')+'\n\nTap to rematch'}
  const mid=(P1.x+P2.x)/2,sp=Math.abs(P1.x-P2.x);
  cam.position.set(mid,gy+1.5,3.4+sp*0.55);cam.lookAt(mid,gy+1,0);
  renderer.render(scene,cam);
}
document.querySelectorAll('.b').forEach(e=>{
  const k=e.dataset.k;
  e.addEventListener('pointerdown',ev=>{ev.preventDefault();held[k]=1;e.classList.add('on')});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>e.addEventListener(t,()=>{held[k]=0;e.classList.remove('on')}));
});
const KM={ArrowLeft:'L',a:'L',ArrowRight:'R',d:'R',j:'P',k:'K',l:'B'};
addEventListener('keydown',e=>{if(KM[e.key])held[KM[e.key]]=1});
addEventListener('keyup',e=>{if(KM[e.key])held[KM[e.key]]=0});
addEventListener('pointerdown',()=>{if(over)reset()});

(async()=>{
  try{
    msg.textContent='Loading road…';
    const gb=await (await fetch('interstate_95_highway.glb')).arrayBuffer();
    {const dv=new DataView(gb),jl=dv.getUint32(12,true),o=20+jl;dv.setUint8(o+7,0);} /* your GLB's BIN chunk tag is malformed; repair it */
    const road=(await new Promise((ok,no)=>new THREE.GLTFLoader().parse(gb,'',ok,no))).scene;
    let bx=new THREE.Box3().setFromObject(road),sz=bx.getSize(V());
    if(sz.z>sz.x)road.rotation.y=Math.PI/2;
    road.updateMatrixWorld(true);bx=new THREE.Box3().setFromObject(road);const c=bx.getCenter(V());
    road.position.set(-c.x,0,-c.z);road.updateMatrixWorld(true);
    road.traverse(o=>{if(o.isMesh)o.receiveShadow=true});scene.add(road);
    const hit=new THREE.Raycaster(V(0,500,0),V(0,-1,0)).intersectObject(road,true)[0];
    gy=hit?hit.point.y:0;
    const m1=await loadFBX('Ch11'),m2=await loadFBX('Ch24');
    P1=new Fighter(m1,-1.5,1);P2=new Fighter(m2,1.5,-1);
    msg.textContent='FIGHT!';setTimeout(()=>{if(!over)msg.textContent=''},900);
    requestAnimationFrame(loop);
  }catch(e){msg.textContent='Load failed:\n'+e.message+'\n\nServe this folder over http and keep all model files next to index.html.'}
})();
</script></body></html>
